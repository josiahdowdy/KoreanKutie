name: Deploy to GitHub Pages

# Publishes the site by mirroring main into the gh-pages branch,
# which GitHub Pages serves at https://josiahdowdy.github.io/KoreanKutie/
# (Branch-based deploy: needs only the default GITHUB_TOKEN.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish main to gh-pages
        run: git push --force origin HEAD:gh-pages
